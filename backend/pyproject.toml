[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "HELIX Fraud Immune System backend"
requires-python = ">=3.10,<3.11"
# Pinned dependencies live in requirements.txt / requirements-dev.txt.

[tool.setuptools.packages.find]
include = ["helix*"]
