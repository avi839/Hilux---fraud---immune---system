[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not perf"
markers =
    property: Hypothesis property-based test of a design correctness property
    integration: test touching I/O edges (FastAPI, WebSocket, DuckDB)
    perf: performance test, excluded by default
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
